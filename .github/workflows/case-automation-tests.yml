name: Repair case automation checks
on:
  pull_request:
    paths:
      - 'automation/**'
      - '.github/workflows/case-automation-tests.yml'
  push:
    branches:
      - 'work/auto-case-pipeline-phase1-20261117'
    paths:
      - 'automation/**'
      - '.github/workflows/case-automation-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test automation/*.test.mjs
