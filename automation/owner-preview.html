<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>オシスマ｜下書き確認（非公開）</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#262626;background:#fff8f2}
*{box-sizing:border-box}body{margin:0}header{background:#ef7625;padding:16px;color:#fff;font-weight:800}
main{max-width:760px;margin:auto;padding:18px}.notice{padding:14px;background:#fff1df;border-radius:12px;margin:16px 0}
.panel{background:#fff;border:1px solid #edddcd;border-radius:12px;padding:16px;margin:16px 0}
h1{font-size:1.45rem;margin:14px 0}h2{font-size:1.2rem}h3{font-size:1.05rem}
p{line-height:1.75;overflow-wrap:anywhere}label{font-weight:700}input{font:inherit;padding:12px;border:1px solid #aaa;border-radius:8px;width:100%;margin:8px 0}
button{font:inherit;color:white;background:#a34b13;padding:12px;border:0;border-radius:9px;width:100%;cursor:pointer}
button:disabled{background:#aaa;cursor:default}.small{color:#666;font-size:.9rem}.item{padding:10px;border-bottom:1px solid #eee}.text{white-space:pre-wrap}
</style></head><body>
<header>オシスマ｜本人限定・公開前の下書き確認</header>
<main><div class="notice">この画面は記事の確認専用です。公開・承認操作はできません。写真はまだ読み込まれません。</div>
<section class="panel"><label for="reportId">報告ID</label><input id="reportId" autocomplete="off" placeholder="R-20261118-xxxxxxxx">
<button id="load">下書きを確認する</button><p id="message" role="status"></p></section>
<div id="result" hidden><section class="panel"><h1 id="title"></h1><p id="stage"></p></section>
<section class="panel"><h2>HP記事の下書き</h2><div id="hp"></div></section>
<section class="panel"><h2>写真の確認状況</h2><div id="photos"></div></section>
<section class="panel"><h2>Google投稿文</h2><div id="gbp" class="text"></div></section>
<p class="small">記事・写真の最終確認が必要です。承認・公開は別の安全な操作で行います。</p></div>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const add=(parent,tag,text,cls)=>{
 const element=document.createElement(tag);if(cls)element.className=cls;
 element.textContent=String(text??'');parent.appendChild(element);return element;
};
function render(data){
 const root=$('result');root.hidden=false;
 $('title').textContent=data.device+'｜'+data.area;
 $('stage').textContent=data.stage==='hold'?'公開保留：修理結果を確認してください':'状態：'+data.stage;
 const hp=$('hp');hp.replaceChildren();
 if(!data.hp)add(hp,'p','HP記事はまだ作成されていません。');
 else{
  add(hp,'h3',data.hp.title+'の'+data.hp.titleServices.join('・'));
  add(hp,'p',data.hp.description);
  for(const section of data.hp.sections){
   add(hp,'h3',section.heading);
   for(const para of section.paragraphs)add(hp,'p',para);
  }
 }
 const photos=$('photos');photos.replaceChildren();
 for(const photo of data.photos){
  const item=document.createElement('div');item.className='item';photos.appendChild(item);
  add(item,'strong',photo.id+'：'+(photo.state==='reviewed'?'確認済み':'未確認・公開不可'));
  add(item,'p',photo.alt||'写真説明は未確認');
 }
 $('gbp').textContent=data.gbp||'Google投稿用の文章はありません。';
}
$('load').addEventListener('click',()=>{
 const id=$('reportId').value.trim();
 if(!/^R-\d{8}-[a-z0-9]{8}$/i.test(id)){$('message').textContent='報告IDを確認してください。';return;}
 if(!(typeof google!=='undefined'&&google.script&&google.script.run)){
  $('message').textContent='Google Apps Scriptから開いてください。';return;
 }
 $('load').disabled=true;$('message').textContent='下書きを確認しています…';$('result').hidden=true;
 google.script.run.withSuccessHandler(data=>{
  $('load').disabled=false;$('message').textContent='';
  render(data);
 }).withFailureHandler(err=>{
  $('load').disabled=false;$('message').textContent=err?.message||'確認できませんでした';
 }).oshPreviewOwnerView(id);
});
})();
</script></body></html>
